name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            musl_target: x86_64-unknown-linux-musl
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            musl_target: aarch64-unknown-linux-musl
          - name: Windows x64
            runner: windows-latest
          - name: Windows arm64
            runner: windows-11-arm

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: arduino/setup-task@v2

      - name: Install browser dependencies
        working-directory: web
        run: npm ci

      - name: Validate
        run: task ci

      - name: Install musl build support
        if: runner.os == 'Linux'
        run: |
          rustup target add "${{ matrix.musl_target }}"
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Validate portable Linux release target
        if: runner.os == 'Linux'
        run: cargo build --release --locked --target "${{ matrix.musl_target }}"
