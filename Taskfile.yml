# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  SMOKE_COMMAND: pwsh -NoProfile -Command "Write-Output rterm-smoke"
  RUN_COMMAND: '{{default "pwsh" .CLI_ARGS}}'

tasks:
  default:
    desc: Run tests
    cmds:
      - task: test

  test:
    desc: Run Rust tests
    cmds:
      - cargo test

  fmt:
    desc: Format Rust code
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Verify Rust formatting without changing files
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Run Rust lint checks
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  web:install:
    desc: Install web dependencies
    dir: web
    cmds:
      - npm install

  web:build:
    desc: Build embedded web assets
    dir: web
    cmds:
      - npm run build

  web:test:
    desc: Run browser input unit tests
    dir: web
    cmds:
      - npm test

  web:verify:
    desc: Rebuild browser assets and verify generated files are current
    cmds:
      - task: web:build
      - git diff --exit-code -- src/web/static

  check:
    desc: Run all non-interactive quality checks
    cmds:
      - task: fmt:check
      - task: web:test
      - task: web:verify
      - task: test
      - task: lint

  build:
    desc: Build embedded web assets and debug binary
    deps:
      - web:build
    cmds:
      - cargo build

  build:release:
    desc: Build embedded web assets and release binary
    deps:
      - web:build
    cmds:
      - cargo build --release

  run:
    desc: Build and run rterm locally; pass child command after --
    deps:
      - build
    cmds:
      - cargo run -- --write -- {{.RUN_COMMAND}}

  run:lan:
    desc: Build and run rterm on LAN; pass child command after --
    deps:
      - build
    cmds:
      - cargo run -- --lan --write -- {{.RUN_COMMAND}}

  smoke:
    desc: Run a child exit-code smoke test
    cmds:
      - cargo run -- --allow-elevated -- {{.SMOKE_COMMAND}}

  smoke:exit-code:
    desc: Run a child exit-code propagation smoke test
    cmds:
      - cargo build
      - pwsh -NoProfile -File scripts/smoke-exit-code.ps1

  smoke:web:
    desc: Probe tokenized web routes on localhost
    cmds:
      - cargo build
      - pwsh -NoProfile -File scripts/smoke-web.ps1

  smoke:browser-input:
    desc: Verify browser Backspace, history arrows, and Ctrl+C through a real PTY
    cmds:
      - cargo build
      - node scripts/smoke-browser-input.mjs

  smoke:sessions:
    desc: Verify session discovery and registry cleanup
    cmds:
      - cargo build
      - pwsh -NoProfile -File scripts/smoke-sessions.ps1

  smoke:starship:
    desc: Verify Starship metadata is hidden outside and available inside a session
    cmds:
      - cargo build
      - pwsh -NoProfile -File scripts/smoke-starship.ps1

  smoke:final-output:
    desc: Verify output from immediately exiting children is drained
    cmds:
      - cargo build
      - pwsh -NoProfile -File scripts/smoke-final-output.ps1

  ci:
    desc: Run the full native CI validation path
    cmds:
      - task: check
      - task: smoke
      - task: smoke:exit-code
      - task: smoke:web
      - task: smoke:browser-input
      - task: smoke:sessions
      - task: smoke:starship
      - task: smoke:final-output
